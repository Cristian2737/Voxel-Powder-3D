name: Build Morphe profanity filter

on:
  push:
    branches:
      - morphe-profanity-filter-prototype
    paths:
      - 'morphe-profanity/**'
      - '.github/workflows/build-morphe-profanity.yml'
  workflow_dispatch:

concurrency:
  group: morphe-profanity-prototype
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out prototype branch
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Run independent profanity and caption timing tests
        run: |
          mkdir -p /tmp/profanity-testclasses
          javac -d /tmp/profanity-testclasses \
            morphe-profanity/src/ProfanityRules.java \
            morphe-profanity/src/ProfanitySchedule.java \
            morphe-profanity/tests/ProfanityScheduleTest.java \
            morphe-profanity/tests/ContentAngelTimingTest.java
          java -cp /tmp/profanity-testclasses \
            app.morphe.extension.youtube.patches.ProfanityScheduleTest
          java -cp /tmp/profanity-testclasses \
            app.morphe.extension.youtube.patches.ContentAngelTimingTest \
            morphe-profanity/tests/contentangel-word-timing.tsv

      - name: Fetch Morphe patches source
        run: git clone --depth 1 --branch v2.2.0 https://github.com/MorpheApp/morphe-patches.git morphe-src

      - name: Apply custom profanity filter
        run: python3 morphe-profanity/apply_to_morphe.py morphe-src

      - name: Check native-audio lifecycle and volume composition
        run: python3 morphe-profanity/tests/run_runtime_tests.py morphe-src

      - name: Build custom Morphe patch bundle
        working-directory: morphe-src
        run: |
          chmod +x gradlew
          ./gradlew buildAndroid --no-daemon

      - name: Set a consistent patch filename
        run: |
          test "$(find morphe-src/patches/build/libs -maxdepth 1 -name '*.mpp' | wc -l)" -eq 1
          cp "$(find morphe-src/patches/build/libs -maxdepth 1 -name '*.mpp' -print -quit)" morphe-src/patches/build/libs/morphe-profanity-filter.mpp

      - name: Upload .mpp patch bundle
        uses: actions/upload-artifact@v4
        with:
          name: morphe-profanity-filter-mpp
          path: morphe-src/patches/build/libs/morphe-profanity-filter.mpp
          if-no-files-found: error

      - name: Publish stable latest download for MacroDroid
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/morphe-profanity-filter-prototype" --jq .object.sha)
          if [ "$current" != "$GITHUB_SHA" ]; then
            echo "A newer source commit exists; preserving its release ownership."
            exit 0
          fi
          tag=morphe-profanity-latest
          artifact=morphe-src/patches/build/libs/morphe-profanity-filter.mpp
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" --title "Morphe Profanity Filter (experimental latest)" \
              --prerelease --notes "Auto-updated after successful experimental source builds. This is not an official Morphe build. Check source and device-test before use."
          gh release upload "$tag" "$artifact" --clobber --repo "$GITHUB_REPOSITORY"
